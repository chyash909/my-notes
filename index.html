<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
  .container { max-width: 500px; margin: 0 auto; }
  .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
  .note-item { text-align: left; }
  .note-time { font-size: 12px; color: #888; }
  .note-text { margin: 4px 0 0; white-space: pre-wrap; }
  textarea { width: 100%; font-size: 16px; padding: 8px; margin-top: 10px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 15px; border: none; border-radius: 8px; background: #333; color: white; cursor: pointer; }
  .toggle-btn { background: #999; margin-left: 8px; }
  h2 { margin-top: 0; }
</style>
</head>
<body>
<div class="container">

  <div class="card" id="addBox" style="display:none;">
    <h2>Add a note</h2>
    <textarea id="noteInput" rows="3" placeholder="Write your update..."></textarea><br>
    <button onclick="saveNote()">Post</button>
    <span id="adminControls"></span>
  </div>

  <div class="card">
    <h2>Notes</h2>
    <div id="notesList">Loading...</div>
  </div>

</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var user = params.get('user') || 'unknown';
  var key = params.get('key') || '';
  var isMe = (user === 'me');
  var scriptUrl = 'https://script.google.com/macros/s/AKfycbz9h3SIFVsrOFpFILYYj-l4_xKRk54VW42RpXDpsH--t4N-mIFT45U6E6RHzRH_l8EwRQ/exec';

  function jsonp(url, callbackName, onDone) {
    window[callbackName] = function (data) {
      onDone(data);
      delete window[callbackName];
      script.remove();
    };
    var script = document.createElement('script');
    script.src = url + '&callback=' + callbackName;
    document.body.appendChild(script);
  }

  jsonp(scriptUrl + '?action=log&user=' + encodeURIComponent(user), 'logCb', function () {});

  loadNotes();

  function loadNotes() {
    jsonp(scriptUrl + '?action=getNotes', 'notesCb', function (data) {
      renderNotes(data.notes);
      var canPost = isMe || data.replyEnabled;
      document.getElementById('addBox').style.display = canPost ? 'block' : 'none';

      if (isMe) {
        document.getElementById('adminControls').innerHTML =
          '<button class="toggle-btn" onclick="toggleReply(' + (!data.replyEnabled) + ')">' +
          (data.replyEnabled ? 'Turn OFF friend replies' : 'Turn ON friend replies') +
          '</button>';
      }
    });
  }

  function renderNotes(notes) {
    var html = '';
    notes.forEach(function (n) {
      var t = new Date(n.timestamp).toLocaleString();
      html += '<div class="note-item"><div class="note-time">' + n.author + ' · ' + t + '</div>' +
              '<p class="note-text">' + escapeHtml(n.text) + '</p></div><hr>';
    });
    document.getElementById('notesList').innerHTML = html || '<p>No notes yet.</p>';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function saveNote() {
    var text = document.getElementById('noteInput').value;
    if (!text.trim()) return;
    var url = scriptUrl + '?action=addNote&user=' + encodeURIComponent(user) +
              '&key=' + encodeURIComponent(key) + '&text=' + encodeURIComponent(text);
    jsonp(url, 'addCb', function (result) {
      if (result.status === 'unauthorized' || result.status === 'replies_disabled') {
        alert('Could not post: ' + result.status);
      } else {
        document.getElementById('noteInput').value = '';
        loadNotes();
      }
    });
  }

  function toggleReply(newValue) {
    var url = scriptUrl + '?action=toggleReply&key=' + encodeURIComponent(key) + '&value=' + newValue;
    jsonp(url, 'toggleCb', function () { loadNotes(); });
  }
</script>
</body>
</html>
